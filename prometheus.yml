global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "app-server-1"
    static_configs:
      - targets: ["172.31.20.10:9100"]
        labels:
          server: "app-server-1"

  - job_name: "app-server-2"
    static_configs:
      - targets: ["172.31.30.20:9100"]
        labels:
          server: "app-server-2"